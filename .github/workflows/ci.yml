name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=0

    steps:
      - uses: actions/checkout@v6

      - name: Verify retained evidence
        run: python3 Tests/HIL/verify_evidence.py

      - name: Install Arm toolchain
        env:
          ARM_GCC_VERSION: 14.2.1-1.1
          ARM_GCC_SHA256: ed8c7d207a85d00da22b90cf80ab3b0b2c7600509afadf6b7149644e9d4790a6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev ninja-build python3-venv
          archive="xpack-arm-none-eabi-gcc-${ARM_GCC_VERSION}-linux-x64.tar.gz"
          curl -fsSL \
            "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v${ARM_GCC_VERSION}/${archive}" \
            -o "${RUNNER_TEMP}/${archive}"
          echo "${ARM_GCC_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/arm-gcc"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/arm-gcc"
          tool_bin="${RUNNER_TEMP}/arm-gcc/xpack-arm-none-eabi-gcc-${ARM_GCC_VERSION}/bin"
          echo "${tool_bin}" >> "${GITHUB_PATH}"
          cmake --version
          "${tool_bin}/arm-none-eabi-gcc" --version
          cargo --version

      - name: Prepare imgtool
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r components/mcuboot-2.4.0/scripts/requirements.txt
          mkdir -p build/ci-keys
          .venv/bin/python components/mcuboot-2.4.0/scripts/imgtool.py keygen \
            -t ecdsa-p256 -k build/ci-keys/debug.pem

      - name: Check Rust updater
        run: |
          cargo fmt --manifest-path Tools/updater/Cargo.toml -- --check
          cargo clippy --manifest-path Tools/updater/Cargo.toml --locked --all-targets --features fake-e2e -- -D warnings

      - name: Run strict host tests
        run: |
          cmake --preset HostTests \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wconversion -Wshadow -Werror -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/HostTests --parallel
          ctest --test-dir build/HostTests --output-on-failure

      - name: Build Debug firmware
        run: |
          cmake --preset Debug \
            -DMCUBOOT_SIGNING_KEY=${{ github.workspace }}/build/ci-keys/debug.pem
          cmake --build build/Debug --parallel
          cmake --build build/Debug --target verify_app_image
          cmake --build build/Debug --target verify_winusb_descriptors
          cmake --build build/Debug --target verify_newlib_syscalls
          arm-none-eabi-size build/Debug/Boot/boot_firmware.elf build/Debug/App/app-1.0.0.elf

      - name: Check Release signing-key policy
        run: |
          if cmake -S . -B build/ReleaseMissingKey -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake; then
            echo "Release configure unexpectedly accepted a missing signing key" >&2
            exit 1
          fi

          mkdir -p build/ci-keys
          .venv/bin/python components/mcuboot-2.4.0/scripts/imgtool.py keygen \
            -t ecdsa-p384 -k build/ci-keys/p384.pem
          if cmake -S . -B build/ReleaseP384 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake \
            -DMCUBOOT_SIGNING_KEY=${{ github.workspace }}/build/ci-keys/p384.pem; then
            echo "Release configure unexpectedly accepted an ECDSA-P384 key" >&2
            exit 1
          fi

      - name: Build Release firmware
        run: |
          .venv/bin/python components/mcuboot-2.4.0/scripts/imgtool.py keygen \
            -t ecdsa-p256 -k build/ci-keys/release.pem
          cmake --preset Release \
            -DMCUBOOT_SIGNING_KEY=${{ github.workspace }}/build/ci-keys/release.pem
          cmake --build build/Release --parallel
          cmake --build build/Release --target verify_app_image
          cmake --build build/Release --target verify_winusb_descriptors
          cmake --build build/Release --target verify_newlib_syscalls
          arm-none-eabi-size build/Release/Boot/boot_firmware.elf build/Release/App/app-1.0.0.elf
