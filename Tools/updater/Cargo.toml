[package]
name = "hc32-updater"
version = "1.0.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[features]
fake-e2e = []

[dependencies]
nusb = "=0.2.3"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "pem", "std"] }
rfd = "=0.15.4"
sha2 = "=0.10.9"
slint = "=1.16.0"

[build-dependencies]
slint-build = "=1.16.0"
